<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>주가 차트 — OpenClaw</title>
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<style>
:root {
  --bg: #0f172a; --bg2: #1e293b; --bg3: #2d3f55;
  --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
  --accent: #38bdf8; --up: #ef4444; --dn: #3b82f6;
  --ma20: #f59e0b; --ma60: #a855f7; --vol: #475569;
  --tag-u: #22c55e; --tag-a: #60a5fa;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px; display: flex; flex-direction: column; overflow: hidden;
}

/* ── 헤더 ─── */
.header {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; flex-shrink: 0;
}
.header h1 { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.back-btn {
  text-decoration: none; color: var(--muted); font-size: 13px;
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px;
  transition: color .2s;
}
.back-btn:hover { color: var(--text); }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.range-group { display: flex; gap: 4px; }
.range-btn {
  background: var(--bg3); border: 1px solid var(--border); color: var(--muted);
  border-radius: 5px; padding: 4px 10px; cursor: pointer; font-size: 12px;
  transition: all .15s;
}
.range-btn:hover { color: var(--text); border-color: var(--accent); }
.range-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); font-weight: 700; }

/* ── 검색 ─── */
.search-wrap {
  position: relative; flex: 1; min-width: 200px; max-width: 340px;
}
.search-input {
  width: 100%; background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 12px 8px 34px; color: var(--text);
  font-size: 14px; outline: none; transition: border-color .2s;
}
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 14px; pointer-events: none;
}
.dropdown {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
  max-height: 320px; overflow-y: auto; z-index: 100; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.dropdown.open { display: block; }
.dd-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
  transition: background .1s;
}
.dd-item:last-child { border-bottom: none; }
.dd-item:hover, .dd-item.focused { background: var(--bg3); }
.dd-code { font-size: 12px; color: var(--muted); font-family: monospace; width: 54px; flex-shrink: 0; }
.dd-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tag {
  font-size: 10px; border-radius: 3px; padding: 1px 5px;
  font-weight: 700; flex-shrink: 0;
}
.tag-u { background: rgba(34,197,94,.15); color: var(--tag-u); }
.tag-a { background: rgba(96,165,250,.15); color: var(--tag-a); }
.dd-mkt { font-size: 11px; color: var(--muted); }

/* ── 종목 인포 바 ─── */
.info-bar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  padding: 8px 16px; display: flex; align-items: center; gap: 16px;
  flex-shrink: 0; min-height: 44px;
}
.info-name { font-size: 16px; font-weight: 700; }
.info-code { color: var(--muted); font-size: 13px; }
.info-price { font-size: 20px; font-weight: 700; }
.info-chg { font-size: 14px; font-weight: 600; }
.info-chg.up { color: var(--up); }
.info-chg.dn { color: var(--dn); }
.info-mkt { margin-left: auto; font-size: 12px; color: var(--muted);
             border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; }

/* ── 차트 ─── */
.chart-container {
  flex: 1; display: flex; flex-direction: column; overflow: hidden; padding: 8px;
}
#chart { flex: 1; min-height: 0; }

/* ── 로딩 / 빈 화면 ─── */
.placeholder {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); gap: 12px;
}
.placeholder-icon { font-size: 48px; }
.placeholder-msg { font-size: 15px; }
.loading-spinner {
  width: 36px; height: 36px; border: 3px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* MA 범례 */
.legend {
  display: flex; gap: 12px; padding: 4px 12px;
  flex-shrink: 0;
}
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.legend-line { width: 20px; height: 2px; border-radius: 1px; }
</style>
</head>

const N_PARTS = 45;

// 파티션 캐시: 번호 -> 데이터 객체
const PART_CACHE = {};

// ticker → stock 빠른 조회
const STOCK_MAP = {};
STOCKS.forEach(s => STOCK_MAP[s.c] = s);

// ── 유틸 ───────────────────────────────────────────────────────────────────
function calcMA(arr, period) {
  const r = new Array(arr.length).fill(null);
  for (let i = period - 1; i < arr.length; i++) {
    let s = 0;
    for (let j = i - period + 1; j <= i; j++) s += arr[j];
    r[i] = Math.round(s / period);
  }
  return r;
}

function sliceLast(ohlcv, nDays) {
  if (!nDays) return ohlcv;  // 전체
  const n = ohlcv.d.length;
  const start = Math.max(0, n - nDays);
  return {
    d: ohlcv.d.slice(start),
    o: ohlcv.o.slice(start),
    h: ohlcv.h.slice(start),
    l: ohlcv.l.slice(start),
    c: ohlcv.c.slice(start),
    v: ohlcv.v.slice(start),
  };
}

function fmt(n) {
  if (n == null) return '-';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
  if (n >= 1_000) return (n / 1_000).toFixed(0) + 'K';
  return n.toLocaleString();
}

function fmtPrice(n) {
  if (n == null) return '-';
  return n.toLocaleString() + '원';
}

// ── 차트 상태 ───────────────────────────────────────────────────────────────
let currentTicker = null;
let currentOhlcv  = null;
let currentDays   = 126;

// ── 파티션 로드 ─────────────────────────────────────────────────────────────
async function loadPartition(pidx) {
  if (PART_CACHE[pidx] !== undefined) return PART_CACHE[pidx];
  const pad = String(pidx).padStart(2, '0');
  try {
    const r = await fetch(`chart_data/p${pad}.json`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    PART_CACHE[pidx] = await r.json();
  } catch(e) {
    PART_CACHE[pidx] = null;
  }
  return PART_CACHE[pidx];
}

async function getOhlcv(ticker) {
  const s = STOCK_MAP[ticker];
  if (!s || s.p < 0) return null;
  const part = await loadPartition(s.p);
  return part ? (part[ticker] || null) : null;
}

// ── 차트 렌더링 ─────────────────────────────────────────────────────────────
function renderChart(ohlcv, ticker, nDays) {
  const data = sliceLast(ohlcv, nDays);
  const ma20 = calcMA(data.c, 20);
  const ma60 = calcMA(data.c, 60);

  const last  = data.c[data.c.length - 1];
  const first = data.c[0];
  const chgPct = ((last - first) / first * 100).toFixed(2);
  const isUp = parseFloat(chgPct) >= 0;

  // 정보 바 갱신
  const s = STOCK_MAP[ticker];
  const name = s ? s.n : ticker;
  const mktLabel = s ? (s.m === 'K' ? 'KOSPI' : 'KOSDAQ') : '';
  document.getElementById('infoBar').innerHTML = `
    <span class="info-name">${name}</span>
    <span class="info-code">${ticker}</span>
    <span class="info-price">${fmtPrice(last)}</span>
    <span class="info-chg ${isUp ? 'up' : 'dn'}">${isUp ? '▲' : '▼'} ${Math.abs(chgPct)}%</span>
    <span style="font-size:12px;color:var(--muted)">(${data.d[0]} ~ ${data.d[data.d.length-1]})</span>
    <span class="info-mkt">${mktLabel}</span>
  `;

  // 거래량 색상 (상승=빨강, 하락=파랑)
  const volColors = data.c.map((c, i) => c >= (data.o[i] || c) ? '#ef444466' : '#3b82f666');

  const traces = [
    {
      type: 'candlestick', name: ticker,
      x: data.d, open: data.o, high: data.h, low: data.l, close: data.c,
      increasing: { line: { color: '#ef4444' }, fillcolor: '#ef444488' },
      decreasing: { line: { color: '#3b82f6' }, fillcolor: '#3b82f688' },
      yaxis: 'y', showlegend: false,
      hoverinfo: 'x+y',
    },
    {
      type: 'scatter', name: 'MA20', x: data.d, y: ma20,
      line: { color: '#f59e0b', width: 1.5 },
      yaxis: 'y', showlegend: false, hoverinfo: 'skip',
    },
    {
      type: 'scatter', name: 'MA60', x: data.d, y: ma60,
      line: { color: '#a855f7', width: 1.5 },
      yaxis: 'y', showlegend: false, hoverinfo: 'skip',
    },
    {
      type: 'bar', name: '거래량', x: data.d, y: data.v,
      marker: { color: volColors },
      yaxis: 'y2', showlegend: false, hoverinfo: 'x+y',
    },
  ];

  const layout = {
    paper_bgcolor: '#0f172a',
    plot_bgcolor:  '#1e293b',
    margin: { t: 10, r: 16, b: 36, l: 72 },
    xaxis: {
      type: 'category',
      showgrid: false, zeroline: false,
      tickfont: { color: '#64748b', size: 11 },
      rangeslider: { visible: false },
      color: '#475569',
    },
    yaxis: {
      domain: [0.28, 1],
      showgrid: true, gridcolor: '#1e293b', gridwidth: 1,
      zeroline: false,
      tickfont: { color: '#64748b', size: 11 },
      color: '#475569',
      tickformat: ',d',
    },
    yaxis2: {
      domain: [0, 0.24],
      showgrid: false, zeroline: false,
      tickfont: { color: '#64748b', size: 10 },
      color: '#475569',
    },
    hoverlabel: {
      bgcolor: '#1e293b', bordercolor: '#334155',
      font: { color: '#e2e8f0', size: 12 },
    },
    dragmode: 'pan',
  };

  const config = {
    responsive: true, displaylogo: false,
    modeBarButtonsToRemove: ['toImage','sendDataToCloud','editInChartStudio',
      'zoom2d','select2d','lasso2d','resetScale2d'],
    scrollZoom: true,
  };

  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('legend').style.display = 'flex';
  const chartEl = document.getElementById('chart');
  chartEl.style.display = 'block';
  Plotly.react(chartEl, traces, layout, config);
}

// ── 종목 선택 ───────────────────────────────────────────────────────────────
async function selectTicker(ticker) {
  if (currentTicker === ticker && currentOhlcv) {
    renderChart(currentOhlcv, ticker, currentDays);
    return;
  }

  currentTicker = ticker;
  currentOhlcv  = null;

  // 로딩 표시
  document.getElementById('infoBar').innerHTML =
    `<div class="loading-spinner"></div><span style="margin-left:8px;color:var(--muted)">데이터 로딩 중...</span>`;
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('chart').style.display = 'none';
  document.getElementById('legend').style.display = 'none';

  const ohlcv = await getOhlcv(ticker);
  if (!ohlcv) {
    document.getElementById('infoBar').innerHTML =
      `<span style="color:var(--muted)">⚠ ${ticker} 데이터 없음 — parquet 파일이 준비되지 않았거나 로드 실패</span>`;
    return;
  }

  currentOhlcv = ohlcv;
  renderChart(ohlcv, ticker, currentDays);
}

// ── 검색 UI ─────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const dropdown    = document.getElementById('dropdown');
let ddFocusIdx    = -1;
let ddItems       = [];

function updateSearch(q) {
  q = q.trim().toLowerCase();
  if (!q) { dropdown.classList.remove('open'); return; }

  const results = [];
  for (const s of STOCKS) {
    if (!q || s.c.startsWith(q) || s.n.toLowerCase().includes(q)) {
      results.push(s);
      if (results.length >= 80) break;
    }
  }

  if (!results.length) { dropdown.classList.remove('open'); return; }

  const html = results.map((s, i) => {
    let tag = '';
    if (s.u === 2) tag = '<span class="tag tag-u">운용</span>';
    else if (s.u === 1) tag = '<span class="tag tag-a">분석</span>';
    const hasData = s.p >= 0;
    const noData  = !hasData ? '<span style="font-size:11px;color:#475569"> 미수집</span>' : '';
    return `<div class="dd-item" data-idx="${i}" data-code="${s.c}">
      <span class="dd-code">${s.c}</span>
      <span class="dd-name">${s.n}${noData}</span>
      ${tag}
      <span class="dd-mkt">${s.m === 'K' ? 'KOSPI' : 'KOSDAQ'}</span>
    </div>`;
  }).join('');

  dropdown.innerHTML = html;
  dropdown.classList.add('open');
  ddItems = dropdown.querySelectorAll('.dd-item');
  ddFocusIdx = -1;

  ddItems.forEach(el => {
    el.addEventListener('mousedown', e => {
      e.preventDefault();
      const code = el.dataset.code;
      searchInput.value = STOCK_MAP[code] ? `${code} ${STOCK_MAP[code].n}` : code;
      dropdown.classList.remove('open');
      selectTicker(code);
    });
  });
}

searchInput.addEventListener('input',  () => updateSearch(searchInput.value));
searchInput.addEventListener('focus',  () => updateSearch(searchInput.value));
searchInput.addEventListener('blur',   () => setTimeout(() => dropdown.classList.remove('open'), 150));
searchInput.addEventListener('keydown', e => {
  if (!dropdown.classList.contains('open')) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    ddFocusIdx = Math.min(ddFocusIdx + 1, ddItems.length - 1);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    ddFocusIdx = Math.max(ddFocusIdx - 1, -1);
  } else if (e.key === 'Enter' && ddFocusIdx >= 0) {
    e.preventDefault();
    ddItems[ddFocusIdx].dispatchEvent(new MouseEvent('mousedown'));
    return;
  } else { return; }
  ddItems.forEach((el, i) => el.classList.toggle('focused', i === ddFocusIdx));
  if (ddFocusIdx >= 0) ddItems[ddFocusIdx].scrollIntoView({block:'nearest'});
});

// 외부 클릭으로 드롭다운 닫기
document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target))
    dropdown.classList.remove('open');
});

// ── 날짜 범위 버튼 ──────────────────────────────────────────────────────────
document.getElementById('rangeGroup').addEventListener('click', e => {
  const btn = e.target.closest('.range-btn');
  if (!btn) return;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentDays = parseInt(btn.dataset.days);
  if (currentOhlcv) renderChart(currentOhlcv, currentTicker, currentDays);
});

// ── 창 크기 변경 시 리사이즈 ────────────────────────────────────────────────
window.addEventListener('resize', () => {
  const c = document.getElementById('chart');
  if (c.style.display !== 'none') Plotly.relayout(c, {});
});

// ── 초기 종목 자동 선택 (유니버스 첫 번째) ─────────────────────────────────
(function autoLoad() {
  const first = STOCKS.find(s => s.u === 2);
  if (first) {
    searchInput.value = `${first.c} ${first.n}`;
    selectTicker(first.c);
  }
})();
</script>

<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>조건검색</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --line: #e3e6eb; --line-strong: #cfd4dc;
  --ink: #16191f; --ink-2: #4a5160; --ink-3: #7d8594;
  --accent: #2c5bd8; --accent-soft: #e8eefc;
  --up: #d6293a; --down: #2563d6;            /* 국내 관례: 상승 빨강 · 하락 파랑 */
  --pass: #127a4a; --pass-soft: #e3f4ea; --fail: #8b93a1; --fail-soft: #f1f3f6;
  --warn: #9a6200; --warn-soft: #fff4dc;
  --ma: #a3abb8;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #171a20; --surface-2: #1e2229; --line: #2a2f38; --line-strong: #3a404b;
    --ink: #eceef2; --ink-2: #b4bac5; --ink-3: #828a98;
    --accent: #7ea2ff; --accent-soft: #1d2840;
    --up: #ff6b78; --down: #6aa0ff;
    --pass: #4cc38a; --pass-soft: #15291f; --fail: #6d7584; --fail-soft: #1e2229;
    --warn: #f0b84a; --warn-soft: #2c2412; --ma: #5d6573;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #171a20; --surface-2: #1e2229; --line: #2a2f38; --line-strong: #3a404b;
  --ink: #eceef2; --ink-2: #b4bac5; --ink-3: #828a98;
  --accent: #7ea2ff; --accent-soft: #1d2840;
  --up: #ff6b78; --down: #6aa0ff;
  --pass: #4cc38a; --pass-soft: #15291f; --fail: #6d7584; --fail-soft: #1e2229;
  --warn: #f0b84a; --warn-soft: #2c2412; --ma: #5d6573;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { font-size: 22px; letter-spacing: -.02em; margin: 0 0 4px; }
.meta { color: var(--ink-3); font-size: 13px; }
.meta b { color: var(--ink-2); font-weight: 600; }
.btn { border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--ink-3); }
a.btn { display: inline-block; text-decoration: none; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.banner { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }

/* 장중 변화 감시 */
.livebox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 14px 16px; margin-bottom: 16px; }
.livehead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.livehead strong { font-size: 14px; }
.livepulse { width: 8px; height: 8px; border-radius: 50%; background: var(--pass); box-shadow: 0 0 0 4px var(--pass-soft); }
.livecounts { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.livestat { display: inline-flex; border-radius: 6px; padding: 2px 7px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; font-weight: 600; }
.livestat.enter { background: var(--pass-soft); color: var(--pass); }
.livestat.exit { background: var(--accent-soft); color: var(--accent); }
.liveevents { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: 6px 14px; margin-top: 11px; }
.liveevent { min-width: 0; border-left: 3px solid var(--line-strong); padding: 3px 0 3px 9px; font-size: 12.5px; color: var(--ink-2); }
.liveevent.enter { border-left-color: var(--pass); }
.liveevent.exit { border-left-color: var(--accent); }
.liveevent a { color: var(--ink); font-weight: 600; text-decoration: none; }
.liveevent a:hover { color: var(--accent); }
.liveevent .time, .liveevent .which { color: var(--ink-3); }
.livefoot { margin-top: 9px; color: var(--ink-3); font-size: 12px; }

/* 조건식 카드 */
.conds { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-bottom: 20px; }
.cond { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; font: inherit; color: inherit; box-shadow: var(--shadow); transition: border-color .12s; }
.cond:hover { border-color: var(--line-strong); }
.cond[aria-selected="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.cond .tag { display: inline-block; font-size: 11px; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 1px 6px; margin-bottom: 6px; }
.cond .nm { font-weight: 600; font-size: 14px; line-height: 1.35; min-height: 38px; }
.cond .cnt { margin-top: 6px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.cond .cnt small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.cond.zero .cnt { color: var(--ink-3); }
.cardlive { min-height: 18px; margin-top: 4px; display: flex; gap: 5px; flex-wrap: wrap; color: var(--ink-3); font-size: 11px; }
.cardlive .new { color: var(--pass); font-weight: 700; }
.cardlive .pending { color: var(--warn); font-weight: 600; }

/* 패널 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.phead { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); }
.phead h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.phead p { margin: 4px 0 0; color: var(--ink-2); }
.combo { margin-top: 10px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--ink-3); }
.combo .lbl { margin-right: 4px; }
.key { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 5px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); font-weight: 700; font-size: 12px; }
.op { color: var(--ink-3); }

.section-title { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .02em; padding: 14px 20px 8px; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--ink-3); background: var(--surface-2); white-space: nowrap; }
.design td { font-size: 13px; }
.design .expr { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; color: var(--ink-2); }
.design .bar { display: flex; align-items: center; gap: 8px; min-width: 120px; }
.design .bar i { display: block; height: 6px; border-radius: 3px; background: var(--accent); opacity: .55; }
.design .bar span { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.src { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; margin-left: 6px; white-space: nowrap; }

.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px 20px 10px; border-top: 1px solid var(--line); }
.tools input { flex: 1 1 200px; max-width: 280px; border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.tools .count { margin-left: auto; color: var(--ink-3); font-size: 13px; }

.hits { overflow-x: auto; }
.hits tbody tr.row { cursor: pointer; }
.hits tbody tr.row:hover td { background: var(--surface-2); }
.hits .rank { color: var(--ink-3); width: 36px; text-align: right; }
.stock .n { font-weight: 600; }
.stock .c { color: var(--ink-3); font-size: 12px; }
.lbadge { display: inline-block; vertical-align: 1px; margin-left: 5px; border-radius: 4px; padding: 0 4px; font-size: 10px; line-height: 16px; font-weight: 700; }
.lbadge.new { background: var(--pass-soft); color: var(--pass); }
.lbadge.pending { background: var(--warn-soft); color: var(--warn); }
.price { text-align: right; white-space: nowrap; }
.price .p { font-weight: 600; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--ink-3); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 2px; height: 22px; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.chip.ok { background: var(--pass-soft); color: var(--pass); }
.chip.no { background: var(--fail-soft); color: var(--fail); text-decoration: line-through; font-weight: 500; }
.chip.na { border: 1px dashed var(--line-strong); color: var(--ink-3); font-weight: 500; }
.sortv { text-align: right; white-space: nowrap; font-weight: 600; }
.spark { display: block; }
a.sparklink { display: inline-block; border-radius: 6px; }
a.sparklink:hover { background: var(--accent-soft); }
.cbtn { display: inline-block; white-space: nowrap; border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; background: var(--surface); }
.cbtn:hover { border-color: var(--accent); background: var(--accent-soft); }
.detail td { background: var(--surface-2); padding: 12px 16px 14px 48px; }
.why { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: start; font-size: 13px; }
.why .chip { justify-self: start; }
.why .m { color: var(--ink); }
.why .v { color: var(--ink-2); font-size: 12.5px; }
.why .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.dlinks { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink-3); }
.dlinks a { color: var(--accent); text-decoration: none; font-weight: 600; }
.dlinks a:hover { text-decoration: underline; }
.empty { padding: 36px 20px; text-align: center; color: var(--ink-3); }
.more { padding: 10px 20px 16px; color: var(--ink-3); font-size: 12px; }

details.help { margin-top: 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; }
details.help summary { cursor: pointer; padding: 10px 0; font-weight: 600; color: var(--ink-2); }
details.help table td { font-size: 13px; padding: 6px 8px; }
details.help table td:first-child { white-space: nowrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -130%); display: none; z-index: 10; }

@media (max-width: 720px) {
  .wrap { padding: 16px 16px 48px; }
  .conds { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }   /* 카드 10개가 한 줄씩 쌓이지 않게 */
  .cond { padding: 10px 12px; }
  .cond .nm { font-size: 13px; }
  .cond .cnt { font-size: 20px; }
  .hide-sm { display: none; }
  /* 행 끝 '차트' 버튼이 표 가로 스크롤 밖으로 밀리지 않게 — 360px 폭에서도 넘침 0 (실측) */
  .hits th, .hits td { padding: 8px 6px; }
  .hits .rank { display: none; }
  .detail td { padding-left: 16px; }
  .why { grid-template-columns: 1fr; }
  .livecounts { margin-left: 0; width: 100%; }
  .liveevents { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>조건검색</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="actions">
      <a class="btn" href="index.html">← 메인 대시보드</a>
      <button class="btn" id="theme" type="button">테마 전환</button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="live"></div>
  <div class="conds" id="conds" role="tablist"></div>
  <div class="panel" id="panel"></div>
  <details class="help">
    <summary>조건식에 쓸 수 있는 지표</summary>
    <table><tbody id="help"></tbody></table>
  </details>
</div>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = v => {
  if (v === null || v === undefined || Number.isNaN(v)) return "—";
  const a = Math.abs(v);
  if (a >= 1000) return Math.round(v).toLocaleString("ko-KR");
  if (a >= 100) return (+v.toFixed(1)).toLocaleString("ko-KR");
  return (+v.toFixed(2)).toLocaleString("ko-KR");
};
const capText = v => v == null ? "—" : v >= 10000 ? `${(v / 10000).toFixed(v >= 100000 ? 0 : 1)}조` : `${Math.round(v).toLocaleString("ko-KR")}억`;
const dirClass = v => v > 0 ? "up" : v < 0 ? "down" : "flat";
// KR 스크리너가 ?code=…&layout=page 로 열리면 그 종목의 차트·재무를 페이지로 띄운다(모달 아님).
// 이 페이지와 같은 디렉토리(Pages 루트)에 있다
const chartUrl = code => `kr_heatmap.html?code=${encodeURIComponent(code)}&layout=page`;

const state = { ci: 0, q: "", market: "ALL", open: new Set() };
try { const s = JSON.parse(localStorage.getItem("cond-ui") || "{}"); if (s.ci < DATA.conditions.length) state.ci = s.ci; } catch (e) {}
const save = () => { try { localStorage.setItem("cond-ui", JSON.stringify({ ci: state.ci })); } catch (e) {} };

// ── 테마
(function () {
  const root = document.documentElement;
  try { const t = localStorage.getItem("cond-theme"); if (t) root.dataset.theme = t; } catch (e) {}
  $("#theme").onclick = () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("cond-theme", root.dataset.theme); } catch (e) {}
  };
})();

// ── 머리말
(function () {
  const u = DATA.universe || {};
  const uni = Object.entries(u).map(([m, n]) => `${m} ${n.toLocaleString("ko-KR")}`).join(" · ");
  const liveMeta = DATA.live && DATA.live.enabled ? ` · <b>장중 5분 감시</b>` : "";
  $("#meta").innerHTML = `데이터 기준 <b>${esc(DATA.asof || "—")}</b> · 생성 ${esc(DATA.generated)} · 대상 ${uni}종목${liveMeta}`;
  const warns = [];
  const today = (DATA.generated || "").slice(0, 10);
  for (const [m, d] of Object.entries(DATA.list_dates || {}))
    if (d && d !== today) warns.push(`${m} 종목 목록·PER 등 펀더멘털이 ${d} 값입니다.`);
  // 장 마감(15:30) 전에 만든 결과는 오늘 봉이 미완성이다 — 거래량·종가 조건이 마감 후와 달라진다
  if (DATA.asof === today && (DATA.generated || "").slice(11) < "15:30")
    warns.push("장중에 만든 결과입니다 — 오늘 봉이 완성되지 않아 거래량·종가 조건은 장 마감 후와 다를 수 있습니다.");
  if (DATA.offline) warns.push("오프라인 모드 — 마지막 캐시로 계산했습니다.");
  for (const e of DATA.errors || []) warns.push(`오류: ${e}`);
  if (warns.length) $("#banner").innerHTML = `<div class="banner">⚠ ${warns.map(esc).join("<br>⚠ ")}</div>`;
  $("#help").innerHTML = (DATA.help || []).map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("");
})();

// ── 오늘의 편입·이탈
function renderLive() {
  const live = DATA.live;
  if (!live || !live.enabled) { $("#live").innerHTML = ""; return; }
  const clock = value => {
    const text = String(value || "").replace("T", " ");
    return text.length >= 16 ? text.slice(11, 16) : text;
  };
  const events = (live.events || []).slice(0, 12).map(event => {
    const enter = event.action === "enter";
    return `<div class="liveevent ${enter ? "enter" : "exit"}">
      <span class="time num">${esc(clock(event.time))}</span>
      <b>${enter ? "편입" : "이탈"}</b>
      <a href="${chartUrl(event.code)}" target="_blank" rel="noopener">${esc(event.name)} <span class="num">${esc(event.code)}</span></a>
      <span class="which">· ${esc(event.condition)}</span>
    </div>`;
  }).join("");
  const baseline = live.baseline
    ? "오늘 첫 스캔으로 기준선을 만들었습니다. 기존 통과 종목은 신규 편입으로 세지 않습니다."
    : "편입과 이탈은 두 번 연속 확인된 뒤 확정합니다.";
  $("#live").innerHTML = `<section class="livebox" aria-label="장중 조건검색 변화">
    <div class="livehead">
      <span class="livepulse" aria-hidden="true"></span><strong>장중 변화 감시</strong>
      <span style="color:var(--ink-3);font-size:12px">최근 확인 ${esc(clock(live.snapshot_at || live.scan_at))}</span>
      <div class="livecounts">
        <span class="livestat enter">오늘 편입 ${Number(live.new_count || 0).toLocaleString("ko-KR")}</span>
        <span class="livestat exit">오늘 이탈 ${Number(live.exit_count || 0).toLocaleString("ko-KR")}</span>
        <span class="livestat">확인 중 +${Number(live.pending_in_count || 0).toLocaleString("ko-KR")} / −${Number(live.pending_out_count || 0).toLocaleString("ko-KR")}</span>
      </div>
    </div>
    ${events ? `<div class="liveevents">${events}</div>` : '<div class="livefoot">아직 확정된 편입·이탈이 없습니다.</div>'}
    <div class="livefoot">${esc(baseline)} 현재가·누적 거래량·시가총액은 장중 값이며 재무 지표는 오전 캐시 기준입니다. 열어 둔 화면은 5분마다 자동 새로고침됩니다.</div>
  </section>`;
}

// 장중 배포가 생기면 열어 둔 탭도 다음 주기에 새 파일을 받는다. 매번 다른 쿼리로 Pages 캐시를 우회한다.
if (DATA.live && DATA.live.enabled) setTimeout(() => {
  const url = new URL(location.href);
  url.searchParams.set("live", Date.now());
  location.replace(url.toString());
}, 5 * 60 * 1000);

// ── 조건식 카드
function renderConds() {
  $("#conds").innerHTML = DATA.conditions.map((c, i) => `
    <button class="cond${c.passed_total ? "" : " zero"}" role="tab" aria-selected="${i === state.ci}" data-i="${i}">
      ${c.purpose ? `<span class="tag">${esc(c.purpose)}</span>` : ""}
      <div class="nm">${esc(c.name)}</div>
      <div class="cnt num">${c.passed_total.toLocaleString("ko-KR")}<small>종목</small></div>
      ${DATA.live && DATA.live.enabled ? `<div class="cardlive">
        <span>확정 ${Number(c.live_confirmed_count || 0).toLocaleString("ko-KR")}</span>
        ${c.live_new_count ? `<span class="new">신규 +${c.live_new_count}</span>` : ""}
        ${c.live_pending_in_count ? `<span class="pending">편입 확인 ${c.live_pending_in_count}</span>` : ""}
        ${c.live_pending_out_count ? `<span class="pending">이탈 확인 ${c.live_pending_out_count}</span>` : ""}
      </div>` : ""}
    </button>`).join("");
  for (const b of document.querySelectorAll(".cond")) b.onclick = () => {
    state.ci = +b.dataset.i; state.open.clear(); state.q = ""; state.market = "ALL"; save(); renderConds(); renderPanel();
  };
}

function comboHtml(text) {
  return esc(text).replace(/\b([A-Z][0-9]?)\b/g, '<span class="key">$1</span>')
    .replace(/(그리고|또는|아님)/g, '<span class="op">$1</span>');
}

// ── 미니 차트 (60일 종가 + 20일선)
function spark(h) {
  const W = 132, H = 34, P = 3;
  const v = h.spark || [], ma = h.ma20 || [];
  if (v.length < 2) return '<span class="flat">—</span>';
  const all = v.concat(ma.filter(x => x != null));
  const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo || 1;
  const x = i => P + i * (W - 2 * P) / (v.length - 1);
  const y = p => H - P - (p - lo) / span * (H - 2 * P);
  const line = arr => arr.map((p, i) => p == null ? null : `${x(i).toFixed(1)},${y(p).toFixed(1)}`).filter(Boolean).join(" ");
  const col = v[v.length - 1] >= v[0] ? "var(--up)" : "var(--down)";
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" data-code="${esc(h.code)}" aria-label="최근 ${v.length}일 종가">
    <polyline points="${line(ma)}" fill="none" stroke="var(--ma)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <polyline points="${line(v)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle class="dot" r="3" fill="${col}" stroke="var(--surface)" stroke-width="1.5" style="display:none"/>
  </svg>`;
}

function bindSparks(hits) {
  const tip = $("#tip");
  const byCode = Object.fromEntries(hits.map(h => [h.code, h]));
  for (const svg of document.querySelectorAll("svg.spark")) {
    const h = byCode[svg.dataset.code]; if (!h) continue;
    const v = h.spark, dot = svg.querySelector(".dot");
    const all = v.concat((h.ma20 || []).filter(x => x != null));
    const lo = Math.min(...all), hi = Math.max(...all), span = hi - lo || 1;
    svg.addEventListener("mousemove", e => {
      const r = svg.getBoundingClientRect();
      const i = Math.max(0, Math.min(v.length - 1, Math.round((e.clientX - r.left - 3) / (r.width - 6) * (v.length - 1))));
      const cx = 3 + i * (132 - 6) / (v.length - 1), cy = 34 - 3 - (v[i] - lo) / span * (34 - 6);
      dot.setAttribute("cx", cx); dot.setAttribute("cy", cy); dot.style.display = "";
      const ago = v.length - 1 - i, ma = h.ma20 && h.ma20[i];
      tip.innerHTML = `${ago ? ago + "일 전" : "마지막"} · 종가 ${fmt(v[i])}${ma != null ? ` · 20일선 ${fmt(ma)}` : ""}`;
      tip.style.left = (r.left + cx) + "px"; tip.style.top = (r.top + cy) + "px"; tip.style.display = "block";
    });
    svg.addEventListener("mouseleave", () => { tip.style.display = "none"; dot.style.display = "none"; });
  }
}

// ── 선택한 조건식 패널
function renderPanel() {
  const c = DATA.conditions[state.ci];
  if (!c) { $("#panel").innerHTML = '<div class="empty">조건식이 없습니다.</div>'; return; }
  const design = c.items.map(it => {
    const n = (c.item_pass || {})[it.key] || 0, base = (c.item_base || {})[it.key] || 0;
    const pct = base ? n / base : 0;
    return `<tr>
      <td><span class="key">${esc(it.key)}</span></td>
      <td>${esc(it.meaning)}${it.bars ? "" : '<span class="src">재무</span>'}</td>
      <td class="expr hide-sm">${esc(it.expr)}</td>
      <td><div class="bar" title="${it.bars ? "일봉 평가 종목" : "전체 대상 종목"} ${base.toLocaleString("ko-KR")}개 중 ${n.toLocaleString("ko-KR")}개 통과"><i style="width:${Math.max(2, pct * 80)}px"></i><span class="num">${n.toLocaleString("ko-KR")} / ${base.toLocaleString("ko-KR")}</span></div></td>
    </tr>`;
  }).join("");

  const q = state.q.trim().toLowerCase();
  const hits = c.hits.filter(h => (state.market === "ALL" || h.market === state.market)
    && (!q || h.name.toLowerCase().includes(q) || h.code.includes(q)));
  const keys = c.items.map(it => it.key);
  const meaning = Object.fromEntries(c.items.map(it => [it.key, it.meaning]));

  const rows = hits.map((h, i) => {
    const chips = keys.map(k => {
      const r = h.items[k] || {}, cls = r.ok === true ? "ok" : r.ok === false ? "no" : "na";
      const mark = r.ok === true ? "✓" : r.ok === false ? "✕" : "?";
      return `<span class="chip ${cls}" title="${esc(meaning[k])} — ${esc(r.why)}">${mark}${esc(k)}</span>`;
    }).join("");
    const open = state.open.has(h.code);
    const liveBadge = h.live_status === "new" ? '<span class="lbadge new">오늘 신규</span>'
      : h.live_status === "pending" ? '<span class="lbadge pending">편입 확인 중</span>' : "";
    const detail = open ? `<tr class="detail"><td colspan="8">
        <div class="why">${keys.map(k => {
          const r = h.items[k] || {}, cls = r.ok === true ? "ok" : r.ok === false ? "no" : "na";
          return `<span class="chip ${cls}">${r.ok === true ? "✓" : r.ok === false ? "✕" : "?"}${esc(k)}</span>
            <div><div class="m">${esc(meaning[k])}</div><div class="v mono num">${esc(r.why)}</div></div>`;
        }).join("")}</div>
        <div class="dlinks">
          <a href="${chartUrl(h.code)}" target="_blank" rel="noopener">차트 보기 →</a>
          <a href="https://finance.naver.com/item/main.naver?code=${encodeURIComponent(h.code)}" target="_blank" rel="noopener">네이버 증권 →</a>
          <span class="num">시총 ${capText(h.cap)} · PER ${fmt(h.per)} · PBR ${fmt(h.pbr)} · ROE ${fmt(h.roe)} · 배당 ${fmt(h.dy)}%</span>
          ${h.last && h.last !== c.asof ? `<span class="num" style="color:var(--warn)">마지막 거래일 ${esc(h.last)} (거래정지 등 확인)</span>` : ""}
        </div></td></tr>` : "";
    return `<tr class="row" data-code="${esc(h.code)}" aria-expanded="${open}">
      <td class="rank num">${i + 1}</td>
      <td class="stock"><div class="n">${esc(h.name)}${liveBadge}</div><div class="c num">${esc(h.code)} · ${esc(h.market)}</div></td>
      <td class="price num"><div class="p">${fmt(h.price)}</div><div class="${dirClass(h.chg)}">${h.chg == null ? "—" : (h.chg > 0 ? "+" : "") + h.chg.toFixed(2) + "%"}</div></td>
      <td class="hide-sm"><a class="sparklink" href="${chartUrl(h.code)}" target="_blank" rel="noopener" title="종목 차트·재무 페이지 (새 창)">${spark(h)}</a></td>
      <td><div class="chips">${chips}</div></td>
      <td class="sortv num">${c.sort ? fmt(h.sort) : ""}</td>
      <td class="hide-sm num" style="color:var(--ink-3);white-space:nowrap">${capText(h.cap)}</td>
      <td><a class="cbtn" href="${chartUrl(h.code)}" target="_blank" rel="noopener" title="종목 차트·재무 페이지 (새 창)">차트 ↗</a></td>
    </tr>${detail}`;
  }).join("");

  const markets = c.markets.length > 1 ? `<div class="seg" role="group" aria-label="시장">${["ALL", ...c.markets].map(m =>
    `<button type="button" data-m="${m}" aria-pressed="${state.market === m}">${m === "ALL" ? "전체" : m}</button>`).join("")}</div>` : "";

  $("#panel").innerHTML = `
    <div class="phead">
      <h2>${esc(c.name)}</h2>
      ${c.desc ? `<p>${esc(c.desc)}</p>` : ""}
      <div class="combo"><span class="lbl">조합</span>${comboHtml(c.combo)}</div>
    </div>
    <div class="section-title">조건 설계표 · 항목별 통과 <span style="font-weight:400">— 재무 항목은 전체 ${c.scanned.toLocaleString("ko-KR")}종목, 일봉 항목은 재무 조건을 먼저 통과한 ${c.evaluated.toLocaleString("ko-KR")}종목 기준</span></div>
    <table class="design"><thead><tr><th style="width:44px">기호</th><th>뜻</th><th class="hide-sm">식</th><th style="width:170px">통과</th></tr></thead><tbody>${design}</tbody></table>
    <div class="tools">
      <input type="search" id="q" placeholder="종목명·코드 찾기" value="${esc(state.q)}">
      ${markets}
      <span class="count num">${hits.length.toLocaleString("ko-KR")}종목 표시${c.passed_total > c.hits.length ? ` · 전체 통과 ${c.passed_total.toLocaleString("ko-KR")}종목 중 상위 ${c.hits.length}` : ""}</span>
    </div>
    ${hits.length ? `<div class="hits"><table>
      <thead><tr><th class="rank">#</th><th>종목</th><th style="text-align:right">현재가</th><th class="hide-sm">60일 (점선 20일선)</th><th>항목</th><th style="text-align:right">${esc(c.sort || "")}${c.sort ? (c.sort_desc ? " ↓" : " ↑") : ""}</th><th class="hide-sm">시총</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>
      <div class="more">행을 누르면 항목별 실제 값이 펼쳐집니다. 작은 그래프나 '차트' 버튼을 누르면 종목 차트·재무 페이지가 새 창으로 열립니다.</div>`
      : `<div class="empty">${c.passed_total ? "검색 조건에 맞는 종목이 없습니다." : "오늘은 이 조건을 통과한 종목이 없습니다."}</div>`}
  `;

  const qi = $("#q");
  qi.oninput = () => { state.q = qi.value; const pos = qi.selectionStart; renderPanel(); const n = $("#q"); n.focus(); n.setSelectionRange(pos, pos); };
  for (const b of document.querySelectorAll(".seg button")) b.onclick = () => { state.market = b.dataset.m; renderPanel(); };
  for (const tr of document.querySelectorAll("tr.row")) tr.onclick = e => {
    if (e.target.closest("a")) return;
    const code = tr.dataset.code;
    state.open.has(code) ? state.open.delete(code) : state.open.add(code);
    renderPanel();
  };
  bindSparks(hits);
}

renderLive();
renderConds();
renderPanel();
</script>
</body>
</html>
